<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Peso Ultra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --s1:#0F1218; --s2:#171B25; --s3:#212736; --line:rgba(255,255,255,.075);
  --tx:#F2F4F8; --tx2:#9AA4BA; --tx3:#5F6A82;
  --blue:#2F80FF; --blue2:#6FA8FF; --gold:#E4B45E; --gold2:#F7D993;
  --dn:#37D69A; --up:#FF8A3D;
  --fd:'Sora','Figtree',system-ui,sans-serif; --fb:'Figtree',system-ui,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.45 var(--fb);min-height:100%;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:440px;margin:0 auto;padding:10px 16px 130px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:.01em}
.brand svg{width:26px;height:26px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--tx2)}
.iconbtn svg{width:20px;height:20px}
.h1{font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.025em;margin:24px 2px 4px}
.sub{color:var(--tx2);margin:0 2px 18px;font-size:14.5px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:28px;padding:20px;margin-bottom:14px}
.card h2{font-size:17px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.card .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.link{color:var(--blue2);font-weight:600;font-size:14px;padding:6px 2px}
.mut{color:var(--tx2)} .sm{font-size:13px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* weight hero */
.wcard{border-radius:36px;padding:20px 16px 18px;text-align:center}
.wtop{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.datechip{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--s2);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600}
.datechip input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.seg{display:inline-flex;background:var(--s2);border-radius:999px;padding:3px}
.seg button{padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--blue);color:#fff}
.wrow{display:flex;align-items:center;justify-content:center;gap:6px;margin:18px 0 6px}
.step{width:52px;height:52px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:24px;color:var(--tx2);flex:none;transition:transform .12s}
.step:active{transform:scale(.92)}
.wbig{flex:1;min-width:0;background:none;border:0;outline:0;text-align:center;font:300 72px/1.05 var(--fd);letter-spacing:-.04em;color:var(--tx);padding:0}
.wbig::placeholder{color:var(--tx3)}
.wunit{font:400 15px var(--fd);color:var(--gold);margin-top:-2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:58px;border-radius:22px;background:var(--blue);color:#fff;font-weight:700;font-size:16.5px;box-shadow:inset 0 0 0 1px rgba(228,180,94,.55);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.985);filter:brightness(1.1)}
.btn.ghost{background:var(--s2);box-shadow:none;color:var(--tx);height:50px;border-radius:18px;font-weight:600;font-size:15px}
.btn.gold{background:var(--gold);color:#1a1200;box-shadow:none}
.btn.danger{background:rgba(255,138,61,.14);color:var(--up);box-shadow:none}
.btn.sm{height:44px;border-radius:16px;font-size:14.5px}
.dl{margin-top:14px;display:flex;justify-content:center;align-items:center;gap:8px;color:var(--tx2);font-size:13px}
.pen-hint{display:none;margin-top:10px;font-size:12.5px;color:var(--gold)}
body.pen .pen-hint{display:block}
.wnote{width:100%;margin-top:16px;background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px;color:var(--tx);outline:0}
.wnote:focus{border-color:rgba(228,180,94,.5)}
.bowl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--tx)}
.bowl .lk{width:40px;height:40px;border-radius:14px;background:var(--s2);display:grid;place-items:center;color:var(--gold);flex:none}
.bowl b{flex:1;font-size:17px;font-weight:600}
.bris{display:grid;gap:6px;margin:2px 0 14px}
.bri{overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:13.5px;line-height:1.25;color:var(--tx)}
.bri.on{border:2px solid var(--gold);padding:7px 9px;background:var(--s3)}
.bri svg{width:40px;height:22px;flex:none}
.bri .bd{flex:1;min-width:0;font-weight:600}.bri .bd .btag{display:inline-block;margin-top:4px;font-size:10.5px;padding:2px 7px}
.bn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.btag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:8px;flex:none;white-space:nowrap}
.bA{background:#633806;color:#FAC775}.bA.bn{background:#BA7517;color:#fff}
.bG{background:#27500A;color:#C0DD97}.bG.bn{background:#3B6D11;color:#fff}
.bC{background:#712B13;color:#F5C4B3}.bC.bn{background:#993C1D;color:#fff}
.bX{background:var(--s3);color:var(--tx2)}.bX.bn{background:#444441;color:#fff}
.bform{margin-bottom:12px}
.chip .ic{width:14px;height:14px;vertical-align:-2px;margin-right:5px}
.bgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.bgrid .h{text-align:center;font-size:11px;color:var(--tx3);font-weight:600}
.bgrid .q{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.bgrid .q.e{border:1px dashed rgba(255,255,255,.14)}
.bgrid .q.f{visibility:hidden}
.bgrid .q.t{box-shadow:0 0 0 2px var(--gold)}
.blg{display:flex;flex-wrap:wrap;gap:4px 12px;margin:10px 0 0;font-size:12px;color:var(--tx2)}
.blg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.bbar>span{width:60px;flex:none;color:var(--tx2)}
.bbar div{flex:1;display:flex;height:24px;border-radius:7px;overflow:hidden;background:var(--s2)}
.bbar div b{display:grid;place-items:center;font-size:11.5px;color:#fff;font-weight:700}
.bsec{background:var(--s2);border-radius:18px;padding:14px;margin:0 0 14px}
.bsec h4{margin:0 0 10px;font-size:15px;font-weight:600}
.ntags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ntags button{padding:6px 11px;border-radius:999px;background:var(--s2);color:var(--tx2);font-size:12.5px;font-weight:600}
.nt{color:var(--gold2)!important}
/* chips + deltas */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--s2);color:var(--tx2);font-size:13.5px;font-weight:600}
.chip.on{background:var(--blue);color:#fff}
.d{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.d svg{width:12px;height:12px;stroke-width:2.6}
.d.dn{color:var(--dn);background:rgba(55,214,154,.12)} .d.up{color:var(--up);background:rgba(255,138,61,.13)} .d.z{color:var(--tx2);background:var(--s2)}
.dn-t{color:var(--dn)} .up-t{color:var(--up)}
/* ring */
.ringwrap{position:relative;width:212px;height:212px;margin:6px auto 4px}
.ring{width:100%;height:100%;transform:rotate(0)}
.arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ringc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringc small{color:var(--tx2);font-size:12.5px}
.ringc b{font:300 48px/1 var(--fd);letter-spacing:-.04em}
.ringc em{font-style:normal;color:var(--gold);font:400 13px var(--fd)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tile{background:var(--s2);border-radius:20px;padding:12px 10px;text-align:center}
.tile small{display:block;color:var(--tx2);font-size:12px}
.tile b{font:600 17px var(--fd);letter-spacing:-.02em}
.eta{margin-top:12px;background:var(--s2);border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.eta .n{font:300 30px/1 var(--fd);color:var(--gold);letter-spacing:-.03em}
.eta p{margin:0;font-size:13px;color:var(--tx2)}
.eta p b{color:var(--tx);font-weight:600}
.msg{margin-top:12px;padding:14px 16px;border-radius:20px;background:rgba(228,180,94,.09);color:var(--gold2);font-size:14px;line-height:1.4}
/* grouped list */
.group{background:var(--s1);border:1px solid var(--line);border-radius:26px;overflow:hidden;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:15px 18px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--s2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15.5px}
.row .t span{display:block;color:var(--tx2);font-size:13px}
.row .v{text-align:right;font:600 16px var(--fd);letter-spacing:-.02em}
.row .v .d{margin-top:3px;font-family:var(--fb)}
.row .lead{width:40px;height:40px;border-radius:14px;background:var(--s2);display:grid;place-items:center;color:var(--blue2);flex:none}
.row .lead.g{color:var(--gold)}
.spark{width:56px;height:24px;flex:none}
.chev{color:var(--tx3);width:18px;height:18px}
/* charts */
.chart{position:relative;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:100%}
.chart svg *{pointer-events:none}
.zreset{position:absolute;top:10px;right:6px;z-index:1;font-size:12px;font-weight:600;color:#6FA8FF;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.tip{position:absolute;top:0;pointer-events:none;background:rgba(33,39,54,.96);border:1px solid var(--line);border-radius:14px;padding:7px 11px;font-size:12.5px;white-space:nowrap;display:none;z-index:2}
.tip b{font:600 14px var(--fd)}
.empty{padding:26px 10px;text-align:center;color:var(--tx2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--s2);border-radius:18px;padding:10px;text-align:center}
.stats small{display:block;color:var(--tx2);font-size:11.5px}
.stats b{font:600 15px var(--fd)}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:stretch;margin:10px 0 4px;height:150px}
.wd div{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:11.5px;color:var(--tx2)}
.wd .bar{width:100%;max-width:30px;border-radius:9px;min-height:4px}
.wd .col{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.wd .pos,.wd .neg{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:30px}
.wd .pos{bottom:50%;border-radius:9px 9px 0 0;background:var(--up)} .wd .neg{top:50%;border-radius:0 0 9px 9px;background:var(--dn)}
.wd .zero{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.ins{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.ins li{background:var(--s2);border-radius:16px;padding:11px 14px;font-size:13.5px;color:var(--tx2);line-height:1.4}
.wk{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.wk:last-child{border-bottom:0}
/* photos */
.month{margin-bottom:22px}
.month h3{font-size:19px;font-weight:600;margin:0 2px 2px;letter-spacing:-.015em}
.month .ms{color:var(--tx2);font-size:13px;margin:0 2px 10px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:var(--s2);display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600}
.ph .btn.ghost{background:var(--s3)}
.filelbl{position:relative;overflow:hidden;cursor:pointer;width:auto;padding:0 18px}
.form label.filelbl{display:flex;flex-direction:row;font-size:14.5px;color:#fff;gap:8px}
.form label.btn.ghost.filelbl{color:var(--tx)}
.filelbl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.ovl{position:relative;overflow:hidden}
.form .ovl input,.ovl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;padding:0;border:0;cursor:pointer}
.ph.add{display:grid;place-content:center;justify-items:center;gap:4px;border:1.5px dashed var(--s3);background:none;color:var(--tx3);font-size:11.5px}
.ph.add svg{width:22px;height:22px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lockbox{text-align:center;padding:40px 20px}
.lockbox svg{width:44px;height:44px;color:var(--gold);margin-bottom:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pdose{background:var(--s2);border-radius:18px;padding:14px;margin:0 0 14px}
.pdose h4{margin:0 0 10px;font-size:15px;font-weight:600}
.pdr{display:grid;grid-template-columns:72px minmax(0,1fr) 78px;align-items:center;gap:10px;margin-bottom:10px;font-size:13.5px}
.pdr .s{display:block;font-size:11.5px;color:var(--tx2);font-weight:400}
.pdr .k{display:block;height:10px;border-radius:5px;background:var(--s3);overflow:hidden}
.pdr .k i{display:block;height:100%;border-radius:5px}
.pdr .r{text-align:right}
.ba{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:var(--s2);touch-action:none;user-select:none;-webkit-user-select:none}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ba .bb{clip-path:inset(0 0 0 50%)}
.ba .bl{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--gold);pointer-events:none}
.ba .bl b{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--gold);color:#0F1218;display:grid;place-items:center;font-size:16px}
.ba .tg{position:absolute;top:10px;font-size:11.5px;font-weight:600;background:rgba(0,0,0,.6);color:#fff;padding:3px 9px;border-radius:8px;pointer-events:none}
.camw{position:relative;margin:0 auto;border-radius:22px;overflow:hidden;background:#000}
.camw video,.camw .gh{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camw .gh{pointer-events:none}
.camw .grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,.18)),linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,.18)),linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,.18)),linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,.18));background-size:100% 1px,100% 1px,1px 100%,1px 100%;background-position:0 33.33%,0 66.66%,33.33% 0,66.66% 0;background-repeat:no-repeat}
.camw .tg{position:absolute;top:10px;left:10px;font-size:11.5px;font-weight:600;background:rgba(0,0,0,.6);color:#fff;padding:3px 9px;border-radius:8px}
.camc{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--tx2)}
.camc input[type=range]{flex:1;accent-color:var(--gold)}
.cmp .lab{font-size:12.5px;color:var(--tx2);text-align:center;padding:4px 0}
/* medicação */
.rx{display:flex;align-items:center;gap:8px;margin:0 0 8px;background:rgba(228,180,94,.09);border-radius:14px;padding:9px 12px;color:var(--gold2);font-size:13px;line-height:1.35}
.rx svg{width:16px;height:16px;flex:none}
.wkb{border-bottom:1px solid var(--line);padding-bottom:2px}
.wkb:last-child{border-bottom:0}
.wkb .wk{border-bottom:0}
.mb{height:32px;padding:0 11px;border-radius:12px;background:var(--s2);color:var(--tx);font-size:12.5px;font-weight:600;flex:none}
.mb.dg{color:var(--up)}
.bodyb{background:var(--s2);border-radius:22px;padding:8px 0}
.bodyb svg{display:block;width:100%;max-width:230px;height:auto;margin:0 auto}
.bfig{fill:var(--s3)}
.site{fill:rgba(47,128,255,.28);stroke:var(--blue);stroke-width:2;cursor:pointer}
.site.on{fill:var(--gold);stroke:var(--gold2)}
.site:focus-visible{outline:2px solid var(--gold)}
/* sheets */
.sheetwrap{position:fixed;inset:0;z-index:50;display:none}
.sheetwrap.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);animation:fade .2s both}
.sheet{position:absolute;left:50%;bottom:0;width:100%;max-width:440px;max-height:92dvh;overflow-y:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:34px 34px 0 0;padding:10px 18px calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);animation:up .32s cubic-bezier(.2,.8,.2,1) both;overscroll-behavior:contain}
.grab{width:42px;height:5px;border-radius:9px;background:var(--s3);margin:0 auto 12px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh-h h3{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.x{width:38px;height:38px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--tx2)}
.x svg{width:18px;height:18px}
.form{display:grid;gap:12px;margin-bottom:16px}
.form label,.fl{display:grid;gap:6px;font-size:13px;color:var(--tx2)}
.form input:not([type=checkbox]),.form select,.form textarea,.fl input{width:100%;background:var(--s2);border:1px solid transparent;border-radius:16px;padding:14px 16px;font-size:16px;color:var(--tx);outline:0}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--blue)}
.form input[type=date]{color-scheme:dark}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex!important;align-items:center;gap:10px;grid-template-columns:none!important;font-size:14.5px!important;color:var(--tx)!important}
.chk input{width:22px;height:22px;accent-color:var(--blue)}
.mrow{display:flex!important;align-items:center;justify-content:space-between;gap:12px;background:var(--s2);border-radius:16px;padding:8px 8px 8px 16px}
.mrow span{color:var(--tx);font-size:14.5px}.mrow small{display:block;color:var(--tx3);font-size:12px}
.mrow input{width:110px!important;text-align:right}
.res{border-radius:20px;padding:14px 16px;margin-bottom:14px;background:var(--s2)}
.res.dn{background:rgba(55,214,154,.1)} .res.up{background:rgba(255,138,61,.11)}
.res b{font:600 22px var(--fd);letter-spacing:-.02em}
.hist{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border:0}
.hist .t{flex:1}.hist .t b{font-weight:600}.hist .t span{display:block;color:var(--tx2);font-size:12.5px}
.hist .v{font:600 16px var(--fd)}
.mini{width:36px;height:36px;border-radius:12px;background:var(--s2);display:grid;place-items:center;color:var(--tx2)}
.mini svg{width:16px;height:16px}
.big{font:300 52px/1 var(--fd);letter-spacing:-.04em}
.photo-full{width:100%;border-radius:22px;display:block;max-height:60dvh;object-fit:contain;background:#000}
.note{font-size:13px;color:var(--tx2);line-height:1.45}
.pill{display:inline-block;background:var(--s2);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--tx2);margin:0 6px 6px 0}
/* dialog + toast */
.dlgwrap{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:24px}
.dlgwrap.open{display:grid}
.dlg{position:relative;background:var(--s2);border:1px solid var(--line);border-radius:30px;padding:24px;width:100%;max-width:360px;animation:pop .2s both}
.dlg h4{margin:0 0 6px;font-size:19px;font-weight:600}.dlg p{margin:0 0 16px;color:var(--tx2);font-size:14.5px}
.dlg input{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;margin-bottom:14px;outline:0}
.dlg .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#2A3144;color:var(--tx);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.28s;z-index:90;width:max-content;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* nav */
.nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(calc(100% - 20px),420px);z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:7px;border-radius:32px;background:rgba(18,21,29,.88);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:26px;color:var(--tx3);font-size:11px;font-weight:600;transition:background .2s,color .2s}
.nav button svg{width:23px;height:23px}
.nav button.on{background:rgba(47,128,255,.17);color:var(--blue2)}
.nav button.on svg{color:var(--gold)}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (hover:hover){.chip:hover,.row:hover,.iconbtn:hover,.step:hover{background:var(--s3)}.chip.on:hover{background:var(--blue)}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (min-width:600px){body{background:#000}.app{border-inline:1px solid var(--line);min-height:100dvh}}
</style>
</head>
<body>
<div class="app"><div id="view"></div></div>
<nav class="nav" id="nav" aria-label="Navegação principal"></nav>
<div class="sheetwrap" id="sheetWrap"><div class="scrim" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="dlgwrap" id="dlgWrap"><div class="scrim"></div><div class="dlg" id="dlgBody"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(()=>{'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayNum=s=>{const[y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmt=(s,o)=>parse(s).toLocaleDateString('pt-BR',o);
const fShort=s=>fmt(s,{day:'numeric',month:'short'});
const fLong=s=>fmt(s,{weekday:'long',day:'numeric',month:'long'});
const fFull=s=>fmt(s,{day:'numeric',month:'short',year:'numeric'});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const mLabel=k=>cap(parse(k+'-01').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
const nf=(n,d=1)=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(n,d=1,m='\u2212')=>{const r=Math.round(n*10**d)/10**d;return (r>0?'+':r<0?m:'')+nf(Math.abs(r),d)};
const num=s=>{const t=String(s??'').replace(',','.').replace(/[^\d.\-]/g,'');const n=parseFloat(t);return isNaN(n)?null:n};
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WDP=['aos domingos','às segundas','às terças','às quartas','às quintas','às sextas','aos sábados'];
const KG2LB=2.2046226218;
const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};

/* ---------- state ---------- */
const KEY='pesoultra.v1';
const blank=()=>({v:1,settings:{unit:'kg',goal:null,startKg:null,age:null,lock:null,lastBackup:null},weights:[],meds:[],bowel:{},measures:{custom:[],entries:{}}});
let S=null; try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
{const b=blank();S=Object.assign(b,S||{});S.settings=Object.assign(blank().settings,S.settings||{});S.measures=S.measures||{};S.measures.custom=S.measures.custom||[];S.measures.entries=S.measures.entries||{};S.weights=S.weights||[];S.meds=Array.isArray(S.meds)?S.meds:[];S.bowel=S.bowel&&typeof S.bowel==='object'?S.bowel:{};}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let PH=[];
const DB={db:null,ok:true,
 open(){if(!this.db)this.db=new Promise((res,rej)=>{try{const r=indexedDB.open('pesoultra',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.db},
 async tx(mode,fn){try{const db=await this.open();return await new Promise((res,rej)=>{const t=db.transaction('photos',mode);const rq=fn(t.objectStore('photos'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}catch(e){this.ok=false;return null}},
 all(){return this.tx('readonly',s=>s.getAll())},put(p){return this.tx('readwrite',s=>s.put(p))},del(id){return this.tx('readwrite',s=>s.delete(id))},clear(){return this.tx('readwrite',s=>s.clear())}
};
const sortPH=()=>PH.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.id<b.id?-1:1);

/* ---------- units ---------- */
const unitL=()=>S.settings.unit;
const toU=kg=>S.settings.unit==='lb'?kg*KG2LB:kg;
const fromU=v=>S.settings.unit==='lb'?v/KG2LB:v;

/* ---------- data ops ---------- */
const BASE=[['abdomen','Barriga (abdômen)'],['cintura','Cintura'],['quadril','Quadril'],['peito','Peito'],['braco_d','Braço direito'],['braco_e','Braço esquerdo'],['coxa_d','Coxa direita'],['coxa_e','Coxa esquerda'],['pescoco','Pescoço']];
const allM=()=>[...BASE.map(([id,name])=>({id,name,custom:false})),...S.measures.custom.map(c=>({id:c.id,name:c.name,custom:true}))];
const mName=id=>(allM().find(m=>m.id===id)||{}).name||id;
const mSeries=id=>(S.measures.entries[id]||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
const MEDS=[['Mounjaro',['2,5','5','7,5','10','12,5','15'],'semanal'],['Ozempic',['0,25','0,5','1','2'],'semanal'],['Wegovy',['0,25','0,5','1','1,7','2,4'],'semanal'],['Trulicity',['0,75','1,5','3','4,5'],'semanal'],['Saxenda',['0,6','1,2','1,8','2,4','3'],'diária'],['Victoza',['0,6','1,2','1,8'],'diária']];
const SITES=[['bd','Braço direito',53,95],['be','Braço esquerdo',147,95],['ad','Abdômen lado direito',84,122],['ae','Abdômen lado esquerdo',116,122],['cd','Coxa direita',84,196],['ce','Coxa esquerda',116,196]];
const siteName=k=>(SITES.find(x=>x[0]===k)||[])[1]||'';
const medTxt=m=>`${m.med} · ${m.dose} mg`;
const medSorted=()=>S.meds.slice().sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:String(b.id).localeCompare(String(a.id)));
const relD=d=>{const n=dayNum(today())-dayNum(d);return n===0?'hoje':n===1?'ontem':fShort(d)};
const wdDM=d=>`${WD[parse(d).getDay()].toLowerCase()} ${d.slice(8)}/${d.slice(5,7)}`;
const weekKey=d=>{const dt=parse(d);dt.setDate(dt.getDate()-((dt.getDay()+6)%7));return ymd(dt)};
let mS=null,medMore=false;
/* próxima dose: a partir da última aplicação + intervalo do remédio (semanal 7 dias, diária 1 dia). "Outro" não tem intervalo conhecido. */
function nextDose(){
  const m=medSorted()[0];if(!m)return null;
  const x=MEDS.find(v=>v[0]===m.med);if(!x)return null;
  const iv=x[2]==='diária'?1:7,date=addDays(m.d,iv);
  return {m,date,diff:dayNum(date)-dayNum(today())};
}
const ndTxt=n=>n.diff<0?`Próxima dose atrasada há ${-n.diff} ${-n.diff===1?'dia':'dias'}`:n.diff===0?'Próxima dose: hoje':n.diff===1?`Próxima dose: amanhã (${wdDM(n.date)})`:`Próxima dose em ${n.diff} dias (${wdDM(n.date)})`;
/* rodízio: o local usado há mais tempo (nunca usado vem primeiro), sem repetir o último */
function nextSite(){
  if(!S.meds.length)return null;
  const last={};S.meds.forEach(m=>{if(!last[m.site]||m.d>last[m.site])last[m.site]=m.d});
  const ls=medSorted()[0].site,c=SITES.map(s=>s[0]).filter(k=>k!==ls);
  c.sort((a,b)=>{const x=last[a]||'',y=last[b]||'';return x<y?-1:x>y?1:0});
  return c[0]||null;
}
function weekRows(weeks,f,t){
  const mp={};S.meds.filter(m=>m.d>=f&&m.d<=t).forEach(m=>{const k=weekKey(m.d);(mp[k]=mp[k]||[]).push(m)});
  const rows=weeks.map(x=>({...x,meds:mp[x.k]||[]}));
  Object.keys(mp).forEach(k=>{if(!rows.some(r=>r.k===k))rows.push({k,avg:null,n:0,delta:null,meds:mp[k]})});
  rows.sort((a,b)=>a.k<b.k?-1:1);rows.forEach(r=>r.meds.sort((a,b)=>a.d<b.d?-1:1));return rows;
}
/* n: nota opcional. undefined mantém a nota que já existia; '' apaga */
function setWeight(d,kg,n){const old=S.weights.find(w=>w.d===d),note=n===undefined?(old&&old.n):n;S.weights=S.weights.filter(w=>w.d!==d);const r={d,kg};if(note)r.n=note;S.weights.push(r);S.weights.sort((a,b)=>a.d<b.d?-1:1);save()}
const NOTE_TAGS=['Comi tarde','Treino pesado','Dormi mal','Fora da dieta','Muito sal','Bebi álcool'];
const BOWEL_OPTS=[['normal','Evacuação normal'],['preso','Constipação (intestino preso)'],['diarreia','Diarreia'],['nao','Não evacuei']];
const cleanNote=s=>String(s||'').replace(/\s+/g,' ').trim().slice(0,80);
function addMeasure(id,d,v){
  const list=(S.measures.entries[id]||[]).filter(e=>e.d!==d);
  const prev=list.filter(e=>e.d<d).sort((a,b)=>a.d<b.d?-1:1).at(-1)||null;
  list.push({d,v});list.sort((a,b)=>a.d<b.d?-1:1);S.measures.entries[id]=list;save();
  return prev?{prev,diff:v-prev.v,pct:(v-prev.v)/prev.v*100}:{prev:null};
}
function mDelta(id){const s=mSeries(id);if(!s.length)return null;const l=s.at(-1),p=s.at(-2);return {last:l,prev:p||null,diff:p?l.v-p.v:null,pct:p?(l.v-p.v)/p.v*100:null}}
const gainGoal=()=>{const e=S.settings;return e.goal!=null&&S.weights.length&&(e.startKg??S.weights[0].kg)<e.goal};
function slope(pts){if(pts.length<2)return null;const xs=pts.map(p=>dayNum(p.d)),ys=pts.map(p=>p.v),mx=avg(xs),my=avg(ys);let n=0,dn=0;xs.forEach((x,i)=>{n+=(x-mx)*(ys[i]-my);dn+=(x-mx)**2});return dn?n/dn:null}

function estimate(){
  const w=S.weights,g=S.settings.goal;if(!w.length||g==null)return null;
  const cur=w.at(-1).kg,dir=Math.sign(g-cur),start=S.settings.startKg??w[0].kg;
  const reached=dir===0||(start>g?cur<=g:cur>=g);
  const pct=reached?100:start===g?0:clamp((start-cur)/(start-g)*100,0,100);
  const age=S.settings.age||35;
  const cap=age>=65?.6:age>=50?.8:1;
  const recent=w.filter(x=>dayNum(x.d)>=dayNum(today())-35);
  let rate=null,src='padrao';
  if(recent.length>=3&&dayNum(recent.at(-1).d)-dayNum(recent[0].d)>=7){const s=slope(recent.map(x=>({d:x.d,v:x.kg})));if(s!=null&&s*dir>0.004){rate=Math.abs(s);src='real'}}
  if(rate==null){const wk=dir<0?(age>=65?.3:age>=50?.4:.5):.25;rate=wk/7}
  rate=Math.min(rate,cap/7);
  const days=reached?0:Math.ceil(Math.abs(g-cur)/rate);
  return {cur,g,dir,reached,pct,rate,src,days,weeks:Math.ceil(days/7),date:addDays(today(),days),start,remain:Math.abs(g-cur)};
}
function streak(){const set=new Set(S.weights.map(w=>w.d));let d=today();if(!set.has(d))d=addDays(d,-1);let n=0;while(set.has(d)){n++;d=addDays(d,-1)}return n}
/* média móvel de 7 dias (janela: o dia e os 6 anteriores) */
function trendAt(n){const a=S.weights.filter(w=>{const k=dayNum(w.d);return k<=n&&k>n-7});return a.length?avg(a.map(w=>w.kg)):null}
function trendNote(pts){
  if(pts.length<4)return '';
  const L=dayNum(pts.at(-1).d),c=trendAt(L),p=trendAt(L-7),u=unitL();
  return `<p class="note" style="margin:10px 2px 0">Tendência atual: <b>${nf(toU(c))} ${u}</b>${p!=null?` (${sg(toU(c-p),1)} ${u} em 7 dias)`:''}</p>`;
}
/* projeção até a meta: reta do último peso até a data prevista de estimate().
   Só aparece se o período termina no último registro. O eixo do gráfico estica até a data da meta (no máximo 365 dias à frente). */
function projFor(pts){
  const e=estimate();if(!e||e.reached||pts.length<2)return null;
  const last=pts.at(-1),wl=S.weights.at(-1);if(!wl||last.d!==wl.d)return null;
  const D=dayNum(e.date)-dayNum(last.d);if(D<1)return null;
  const ext=Math.min(D,365),goalU=toU(e.g);
  return {d0:last.d,v0:last.v,D,goalU,ext,full:ext>=D,date:e.date,src:e.src,rate:e.rate,vEnd:last.v+(goalU-last.v)*ext/D};
}
function projNote(p){
  if(!p)return '';const u=unitL();
  const base=p.full?`Chegada prevista em <b>${fFull(p.date)}</b>.`:`A meta de ${nf(p.goalU)} ${u} é prevista para <b>${fFull(p.date)}</b>, mais de um ano à frente; o gráfico mostra só o primeiro ano.`;
  const src=p.src==='real'?`No seu ritmo recente (${nf(toU(p.rate*7),2)} ${u}/semana).`:'Pelo ritmo padrão para a sua idade; passa a usar o seu ritmo real com mais registros.';
  return `<p class="note" style="margin:8px 2px 0"><span style="color:#DCE6FF;font-weight:700">┄┄</span> Pontilhado: projeção até a meta. ${base} ${src}</p>`;
}
function trendPts(pts){return pts.length<4?null:pts.map(p=>({d:p.d,v:toU(trendAt(dayNum(p.d)))}))}
/* marcos e conquistas */
function milestones(){
  const w=S.weights,g=S.settings.goal,u=unitL(),done=[],T=[1,2,5,10,15,20,25,30,40,50];
  if(!w.length)return {done,next:null};
  const start=S.settings.startKg??w[0].kg,hasG=g!=null&&start!==g,dir=g!=null&&start>g?-1:1,total=hasG?Math.abs(start-g):0;
  const prog=kg=>dir<0?start-kg:kg-start,cur=prog(w.at(-1).kg);
  const first=f=>{const x=w.find(f);return x?x.d:null};
  const cand=[];
  if(hasG){
    T.filter(t=>fromU(t)<=total+1e-9).forEach(t=>{const kg=fromU(t),title=dir<0?`−${nf(t,0)} ${u} perdidos`:`+${nf(t,0)} ${u} ganhos`,d=first(x=>prog(x.kg)>=kg-1e-9);d?done.push({id:'k'+t,t:title,d}):cand.push({title,rem:kg-cur})});
    [[10,'10% do caminho'],[25,'25% do caminho'],[50,'Metade do caminho'],[75,'75% do caminho'],[100,'Meta atingida']].forEach(([p,title])=>{const need=total*p/100,d=first(x=>prog(x.kg)>=need-1e-9);d?done.push({id:'p'+p,t:title,d}):cand.push({title,rem:need-cur})});
  }
  const ds=[...new Set(w.map(x=>x.d))].sort();let run=0;const sk={};
  ds.forEach((d,i)=>{run=i&&dayNum(d)-dayNum(ds[i-1])===1?run+1:1;[7,14,30,60,100].forEach(n=>{if(run>=n&&!sk[n]){sk[n]=d;done.push({id:'s'+n,t:`${n} dias seguidos registrando`,d})}})});
  [10,30,100,200].forEach(n=>{if(w.length>=n)done.push({id:'n'+n,t:`${n} registros de peso`,d:w[n-1].d})});
  [['cintura','Cintura'],['abdomen','Abdômen']].forEach(([id,name])=>{const s=mSeries(id);if(s.length<2)return;[2,5,10,15].forEach(t=>{const e=s.find(x=>s[0].v-x.v>=t-1e-9);if(e)done.push({id:'m'+id+t,t:`${name} −${t} cm`,d:e.d})})});
  done.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:a.id<b.id?-1:1);
  const nx=cand.filter(c=>c.rem>0).sort((a,b)=>a.rem-b.rem)[0];
  return {done,next:nx?`Próximo marco: ${nx.title} (faltam ${nf(toU(nx.rem),1)} ${u})`:null};
}
const msIds=()=>new Set(milestones().done.map(x=>x.id));
function announce(before,extra){
  const nw=milestones().done.filter(x=>!before.has(x.id)),m=[];
  if(extra)m.push(extra);
  if(nw.length)m.push(nw.length===1?`Novo marco: ${nw[0].t}`:`${nw.length} novos marcos: ${nw.map(x=>x.t).join(', ')}`);
  if(m.length)setTimeout(()=>toast(m.join(' · ')),3000);
}
function motivation(){
  const w=S.weights;if(!w.length)return 'Registre seu primeiro peso para começar. Cada dado conta.';
  const e=estimate(),last=w.at(-1),since=dayNum(today())-dayNum(last.d),st=streak(),u=unitL();
  if(e&&e.reached)return 'Meta atingida! Agora o desafio é manter. Defina uma nova meta quando quiser.';
  if(since>=3)return `Faz ${since} dias desde o último registro. Que tal se pesar hoje?`;
  if(st>=7)return `${st} dias seguidos registrando. Constância é o que gera resultado.`;
  const p=w.at(-2);
  if(p&&last.kg<p.kg)return `Você está ${nf(toU(p.kg-last.kg),1)} ${u} abaixo do registro anterior. Continue assim.`;
  if(e&&e.pct>=50)return 'Você já passou da metade do caminho. O mais difícil ficou para trás.';
  if(p&&last.kg>p.kg)return 'Oscilações diárias são normais. O que importa é a tendência das últimas semanas.';
  return 'Um dia de cada vez. Você está no caminho certo.';
}
function patterns(from,to){
  const w=S.weights.filter(x=>x.d>=from&&x.d<=to);
  const acc=Array.from({length:7},()=>({s:0,n:0}));let pairs=0;
  for(let i=1;i<w.length;i++){const gap=dayNum(w[i].d)-dayNum(w[i-1].d);if(gap>=1&&gap<=3){const k=parse(w[i].d).getDay();acc[k].s+=(w[i].kg-w[i-1].kg)/gap;acc[k].n++;pairs++}}

  else{
    const c=wd.map((v,i)=>({v,i,n:acc[i].n})).filter(x=>x.v!=null&&x.n>=2);
    if(c.length){
      const worst=c.reduce((a,b)=>b.v>a.v?b:a),best=c.reduce((a,b)=>b.v<a.v?b:a);
      if(worst.v>0.05)L.push(`Seu peso tende a subir mais ${WDP[worst.i]}: ${sg(toU(worst.v),2)} ${u}/dia em média. Vale olhar o que muda no dia anterior: refeições, sal, bebidas e sono.`);

  return {wd,acc,weeks,lines:L,pairs};
}

/* ---------- chips ---------- */
function chipD(diff,dec,unit,pct,inv=false){
  if(diff==null)return '';
  const r=Math.round(diff*10**dec)/10**dec;
  const cls=r===0?'z':((r<0)!==inv)?'dn':'up';
  const ar=r===0?'':(r<0?ic.dn:ic.up);
  return `<span class="d ${cls}">${ar}${sg(diff,dec)} ${unit}${pct!=null?` · ${sg(pct,1)}%`:''}</span>`;
}
const chipW=(dd)=>chipD(dd,1,unitL(),null,gainGoal());

function spark(pts,inv=false){
  if(pts.length<2)return '<svg class="spark" viewBox="0 0 56 24"></svg>';
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn||1;
  const d=pts.map((p,i)=>`${i?'L':'M'}${(i/(pts.length-1)*54+1).toFixed(1)} ${(21-(p.v-mn)/r*18).toFixed(1)}`).join('');
  const c=((pts.at(-1).v<pts[0].v)!==inv)?'#37D69A':'#FF8A3D';
  return `<svg class="spark" viewBox="0 0 56 24"><path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* peso por dose: cada dose vai da 1ª aplicação até a troca; usa a média de 7 dias nas pontas */
function doseStats(){
  const ms=S.meds.slice().filter(m=>m.med&&m.dose).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);if(!ms.length)return null;
  const seg=[];ms.forEach(m=>{const k=m.med+'|'+m.dose,l=seg.at(-1);if(l&&l.k===k)l.n++;else seg.push({k,med:m.med,dose:m.dose,d0:m.d,n:1})});
  const td=today(),multi=new Set(seg.map(s=>s.med)).size>1,gg=gainGoal();
  /* início: média de 7 dias no dia da 1ª aplicação; se não houver pesagem antes, a 1ª pesagem dentro do período. fim: média de 7 dias no fim; senão a última pesagem do período */
  const wS=(a,b)=>{const tr=trendAt(a);if(tr!=null)return tr;const w=S.weights.find(x=>{const k=dayNum(x.d);return k>=a&&k<=b});return w?w.kg:null};
  const wE=(a,b)=>{const tr=trendAt(b);if(tr!=null)return tr;const w=S.weights.filter(x=>{const k=dayNum(x.d);return k>=a&&k<=b}).at(-1);return w?w.kg:null};
  seg.forEach((s,i)=>{s.d1=i<seg.length-1?seg[i+1].d0:td;s.cur=i===seg.length-1;const a=dayNum(s.d0),b=dayNum(s.d1);s.days=b-a;s.wk=s.days/7;
    const w0=wS(a,b),w1=wE(a,b);s.ch=w0!=null&&w1!=null?w1-w0:null;s.ok=s.ch!=null&&s.days>=7;s.full=s.ok&&s.wk>=2;s.rate=s.ok?s.ch/s.wk:null;s.prog=s.ok?(gg?s.rate:-s.rate):null;
    s.lab=(multi?s.med+' ':'')+s.dose+' mg'});
  const v=seg.filter(s=>s.ok),mx=Math.max(...v.map(s=>Math.abs(s.rate)),.01);
  const c=seg.at(-1),pv=seg.length>1?seg.at(-2):null;let warn=null;
  if(c.full&&pv&&pv.full&&pv.prog>0&&c.prog<pv.prog*.5){c.flag=1;warn=c.prog<=0?'Na dose atual o peso parou de ir em direção à meta.':`Na dose atual o ritmo caiu para ${Math.max(1,Math.round(c.prog/pv.prog*100))}% do da dose anterior.`}
  return {seg,mx,warn};
}

async function deriveKey(pass,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encPayload(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await deriveKey(pass,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj)));return {app:'peso-ultra',v:1,enc:true,kdf:'PBKDF2-SHA256-200000',salt:b64(salt),iv:b64(iv),ct:b64(ct)}}
async function decPayload(f,pass){const k=await deriveKey(pass,unb64(f.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(f.iv)},k,unb64(f.ct));return JSON.parse(new TextDecoder().decode(pt))}
let persisted=null;
async function makeBackup(withPh,pw){
  let out={app:'peso-ultra',v:1,enc:false,data:payload(withPh)};
  if(pw)out=await encPayload(payload(withPh),pw);
  return {blob:new Blob([JSON.stringify(out)],{type:'application/json'}),name:`peso-ultra-backup-${today()}${pw?'-criptografado':''}.json`};
}
async function shareFile(blob,name){
  if(navigator.share&&navigator.canShare){
    for(const t of ['application/json','text/plain']){
      const f=new File([blob],name,{type:t});
      if(navigator.canShare({files:[f]})){
        try{await navigator.share({files:[f],title:'Backup do Peso Ultra'});return 'shared'}
        catch(e){return e&&e.name==='AbortError'?'cancel':'unsupported'}

    }
  }
  return 'unsupported';
}
async function finishBackup(blob,name){

function pdfChart(doc,x,y,w,h,pts,o={}){

  const t0=dayNum(pts[0].d),span=Math.max(1,dayNum(pts.at(-1).d)-t0),vals=pts.map(p=>p.v);if(o.goal!=null)vals.push(o.goal);

  doc.setFontSize(7);doc.setFont('helvetica','normal');
  for(let k=0;k<4;k++){const v=mn+(mx-mn)*k/3,yy=Y(v);doc.setDrawColor(235,238,244);doc.setLineWidth(.15);doc.line(x+pl,yy,x+w-pr,yy);if(!o.small){doc.setTextColor(...C.mut);doc.text(pt_(nf(v,o.dec??1)),x+pl-1.5,yy+1,{align:'right'})}}
  if(!o.small){doc.setTextColor(...C.mut);doc.text(pt_(fShort(pts[0].d)),x+pl,y+h-2);doc.text(pt_(fShort(pts.at(-1).d)),x+w-pr,y+h-2,{align:'right'})}
  if(o.goal!=null){doc.setDrawColor(...C.gold);doc.setLineWidth(.4);doc.setLineDash([1.6,1.6],0);doc.line(x+pl,Y(o.goal),x+w-pr,Y(o.goal));doc.setLineDash([])}
  doc.setLineWidth(.6);
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],c=b.v===a.v?C.mut:((b.v<a.v)!==!!o.inv)?C.green:C.orange;doc.setDrawColor(...c);doc.line(X(a.d),Y(a.v),X(b.d),Y(b.v))}
  if(pts.length<=45){doc.setFillColor(255,255,255);doc.setLineWidth(.35);pts.forEach(p=>{doc.setDrawColor(...C.blue);doc.circle(X(p.d),Y(p.v),.7,'FD')})}
  doc.setFillColor(...C.gold);doc.circle(X(pts.at(-1).d),Y(pts.at(-1).v),1.1,'F');
  if(o.bowel){const BC={A:[186,117,23],G:[59,109,17],C:[153,60,29],X:[95,94,90]},t1=dayNum(pts.at(-1).d),yb=y+h-9;o.bowel.forEach(b=>{const k=dayNum(b.d);if(k<t0||k>t1)return;doc.setFillColor(...BC[b.c]);doc.circle(X(b.d),yb,1.7,'F');if(b.n!==''&&span<=120){doc.setFontSize(5.5);doc.setFont('helvetica','bold');doc.setTextColor(255,255,255);doc.text(String(b.n),X(b.d),yb+.75,{align:'center'})}});doc.setFont('helvetica','normal')}
}

async function startCam(){
  stopCam();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Câmera ao vivo indisponível neste ambiente. Abra o link no Chrome.');return false}
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:camFace},width:{ideal:1440},height:{ideal:1920}},audio:false});
    openSheet(camHTML());const v=$('#camV');v.srcObject=camStream;
    const fit=()=>{const w=$('#camW');if(w&&v.videoWidth){const r=v.videoWidth/v.videoHeight;w.style.aspectRatio=v.videoWidth+'/'+v.videoHeight;w.style.width=`min(100%, calc(62dvh * ${r.toFixed(4)}))`}};v.addEventListener('loadedmetadata',fit);
    const r=$('#camOp');if(r)r.addEventListener('input',()=>{camOp=r.value/100;const g=$('#camG');if(g)g.style.opacity=camOp});
    try{await v.play()}catch(e){}fit();return true}
  catch(e){toast('Sem acesso à câmera ('+(e.name||'erro')+'). Abra o link no Chrome e permita a câmera.');return false}
}

 bdate:el=>{bowDate=el.value||today();bowRefresh()},
 rph:el=>{PER.rep.photos=el.checked;repPhRefresh()},
 rphm:el=>{PER.rep.phm=el.value;repPhRefresh()},
 baA:el=>{ba.a=el.value;baOpen()},
 baB:el=>{ba.b=el.value;baOpen()},
 perfrom:el=>{PER[el.dataset.sc].from=el.value;repaint(el.dataset.sc)},
 perto:el=>{PER[el.dataset.sc].to=el.value;repaint(el.dataset.sc)},
 pdate:el=>{pState.d=el.value;const w=weightAt(el.value);if(num($('#pW').value)==null&&w!=null){$('#pW').value=nf(toU(w),1);pState.kg=w}},
 cmp:()=>{cmp.a=$('#cA').value;cmp.b=$('#cB').value;openSheet(cmpHTML())}
};
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el,e)});
document.addEventListener('pointerdown',e=>{document.body.classList.toggle('pen',e.pointerType==='pen')},true);
document.addEventListener('pointerover',e=>{if(e.pointerType==='pen')document.body.classList.add('pen')},true);
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.act==='medSite'){e.preventDefault();A.medSite(e.target);return}if(e.key==='Escape'){if($('#dlgWrap').classList.contains('open'))return;closeSheet()}if(e.key==='Enter'&&e.target.id==='wIn')A.reg()});
document.addEventListener('change',e=>{const c=e.target.classList;if(c&&c.contains('pfile'))onPhotoFile(e);else if(c&&c.contains('rfile'))onRestore(e)});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawCharts,150)});

/* ---------- boot ---------- */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(p=>p||navigator.storage.persist()).then(p=>{persisted=!!p}).catch(()=>{})}}catch(e){}
renderView();
DB.all().then(r=>{if(Array.isArray(r)&&r.length){PH=r;sortPH();if(tab==='home'||tab==='fotos')renderView(true)}});
})();
</script>
